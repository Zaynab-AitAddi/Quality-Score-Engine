[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-score-engine"
version = "1.0.0"
description = "Content-only listing quality score engine (0-100) with explainable component breakdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "imagehash>=4.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.36",
    "open-clip-torch>=2.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
quality-engine = "quality_engine.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
